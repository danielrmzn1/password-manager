[package]
name = "password-manager"
version = "0.1.0"
description = "Encrypted password manager with S3-compatible sync"
authors = ["Daniel Ramirez"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "password_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# --- cryptography (RustCrypto) ---
argon2 = "0.5"
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
zeroize = { version = "1", features = ["derive"] }
subtle = "2"
getrandom = "0.4"
base64 = "0.23"
uuid = { version = "1", features = ["v4", "serde"] }
# Master-password strength feedback (dictionary/pattern aware, unlike a
# charset x length heuristic). Only ever run on a candidate password the user is
# choosing — never on a stored secret.
zxcvbn = "3"

# --- async runtime, S3 sync, extension bridge ---
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
aws-sdk-s3 = { version = "1", features = ["behavior-version-latest"] }
aws-credential-types = "1"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }

# --- import / export ---
csv = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
# Smaller, harder-to-inspect release binaries; `lto`/`codegen-units = 1` also
# help the optimizer keep zeroized buffers from being duplicated around.
codegen-units = 1
lto = true
opt-level = "s"
strip = true
